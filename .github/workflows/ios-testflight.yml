name: iOS TestFlight

# Cách chạy: tab Actions -> "iOS TestFlight" -> Run workflow.
# (hoặc đẩy tag dạng ios-v1.0.1 để tự chạy)
# Quy trình: đóng gói mobile.html bằng Capacitor -> build/ký trên máy Mac của GitHub -> tải lên TestFlight.
# Hướng dẫn từng bước cho phần phía Apple: native/HUONG-DAN-TESTFLIGHT.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Số phiên bản hiển thị (vd 1.0.0). Để trống = 1.0.0"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Kiểm tra đã nhập đủ 4 khóa bí mật
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secrets:$missing. Vào Settings > Secrets and variables > Actions để thêm (xem native/HUONG-DAN-TESTFLIGHT.md, bước 4)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Cài thư viện và đồng bộ web vào app iOS
        run: |
          npm ci
          npm run sync

      - name: Kiểm tra Xcode (bắt buộc Xcode 26 trở lên)
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major quá cũ. Apple yêu cầu Xcode 26 trở lên khi tải lên App Store Connect."
            exit 1
          fi

      - name: Chuẩn bị khóa App Store Connect
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Chấp nhận cả nội dung .p8 dán nguyên văn lẫn dạng base64
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || { echo "::error::ASC_KEY_P8 không phải file .p8 hợp lệ."; exit 1; }
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Đọc cấu hình app
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          BUNDLE_ID=$(jq -r .appId capacitor.config.json)
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#ios-v}"; fi
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Bundle ID: $BUNDLE_ID | Phiên bản: $VERSION | Build: ${GITHUB_RUN_NUMBER}"

      - name: Build và ký (archive)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Ký phát hành và tải lên TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Xong
        run: |
          {
            echo "### Đã tải bản $APP_VERSION (build ${GITHUB_RUN_NUMBER}) lên App Store Connect"
            echo ""
            echo "Chờ khoảng 5-15 phút để Apple xử lý, sau đó vào App Store Connect > TestFlight để thêm vào nhóm thử nghiệm."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dọn khóa
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
