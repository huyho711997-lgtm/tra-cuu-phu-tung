<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASCO DLK · Cloud trên máy tính</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icons/icon-192.png" type="image/png" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#08121f;--navy-900:#0b1b30;--navy-800:#10233d;--navy-700:#14284a;--navy-600:#1d3558;
  --teal-300:#a7e0e6;--teal-400:#8fd0d8;--teal-500:#63adb6;--teal-600:#4a98a3;
  --bg:#eef4f6;--card:#fff;--ink:#12243a;--ink-2:#4b6078;--ink-3:#7d90a6;--line:#d9e4ea;
  --danger:#e5566d;--radius:16px;--side:288px;--tile:200px;
  --shadow:0 1px 2px rgba(11,27,48,.06),0 8px 24px -10px rgba(11,27,48,.18);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
svg{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--teal-500);outline-offset:2px}
::selection{background:rgba(99,173,182,.3)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#b8c9d3;border-radius:8px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#98afbd;background-clip:content-box;border:2px solid transparent}

/* ---------- Đăng nhập ---------- */
.login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(900px 500px at 15% 10%,rgba(99,173,182,.28),transparent 60%),radial-gradient(800px 600px at 90% 100%,rgba(29,53,88,.9),transparent 60%),linear-gradient(160deg,var(--navy-900),var(--navy-950));z-index:50;padding:24px}
.login-card{width:min(420px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:34px 32px 30px;color:#e9f6f8;backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--teal-400),var(--teal-600));color:#07202a;box-shadow:0 10px 24px -8px rgba(99,173,182,.7)}
.brand-mark svg{width:24px;height:24px;stroke-width:2}
.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:.16em}
.brand small{display:block;margin-top:2px;font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--teal-400)}
.login h1{margin:26px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.login p.sub{color:#a9bdd0;font-size:13.5px;line-height:1.55;margin-bottom:22px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9bb3c8;margin-bottom:7px}
.field input{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(8,18,31,.55);color:#fff;padding:0 15px;font-size:15px;transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:0;border-color:var(--teal-400);box-shadow:0 0 0 4px rgba(143,208,216,.18)}
.btn-primary{width:100%;height:50px;border-radius:15px;margin-top:8px;font-weight:800;font-size:15px;color:#06141f;background:linear-gradient(180deg,var(--teal-300),#7fc2cb);box-shadow:0 12px 26px -10px rgba(127,194,203,.7);transition:transform .15s,filter .15s}
.btn-primary:hover{filter:brightness(1.05)}.btn-primary:active{transform:scale(.985)}.btn-primary:disabled{opacity:.6;cursor:wait}
.login-error{margin-top:14px;padding:11px 13px;border-radius:12px;background:rgba(229,86,109,.14);border:1px solid rgba(229,86,109,.35);color:#ffc2cb;font-size:13px;line-height:1.5}

/* ---------- Khung ứng dụng ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh}
.side{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,var(--navy-900),var(--navy-950));color:#cfe0ee;border-right:1px solid rgba(255,255,255,.05)}
.side-head{padding:22px 20px 16px}
.side-head .brand-mark{width:40px;height:40px;border-radius:12px}
.side-head .brand b{font-size:13px;color:#fff}
.side-scroll{flex:1;overflow:auto;padding:4px 12px 12px}
.side h3{margin:18px 10px 8px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:#6f8aa5;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:12px;color:#c3d6e6;font-size:13.5px;font-weight:600;text-align:left;transition:background .15s,color .15s}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.is-on{background:linear-gradient(90deg,rgba(143,208,216,.2),rgba(143,208,216,.07));color:#fff;box-shadow:inset 2px 0 0 var(--teal-400)}
.nav svg{color:var(--teal-400);width:17px;height:17px}
.nav .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{font-size:11.5px;font-weight:700;color:#7f98b1;font-variant-numeric:tabular-nums}
.nav.is-on .n{color:var(--teal-300)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:#c3d6e6;font-size:12px;font-weight:600;transition:all .15s}
.chip:hover{background:rgba(255,255,255,.07)}
.chip.is-on{background:var(--teal-400);border-color:var(--teal-400);color:#06202a}
.chip i{font-style:normal;font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.side-foot{padding:14px 16px 16px;border-top:1px solid rgba(255,255,255,.07);display:grid;gap:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05)}
.stat b{display:block;font-size:15px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:#7f98b1;font-weight:600;letter-spacing:.04em}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy-600),var(--navy-700));border:1px solid rgba(255,255,255,.15);font-size:12px;font-weight:800;color:var(--teal-300)}
.who div{min-width:0;flex:1}.who b{display:block;font-size:12.5px;color:#e6f1f8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{font-size:11px;color:#7f98b1}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#9db4c8;transition:background .15s,color .15s}
.icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:rgba(238,244,246,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:5}
.title{min-width:0}
.title h2{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3);font-weight:600}
.search{position:relative;flex:1;max-width:460px;margin-left:auto}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;padding:0 14px 0 40px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:0;border-color:var(--teal-500);box-shadow:0 0 0 4px rgba(99,173,182,.16)}
.tool{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink-2);transition:all .15s;white-space:nowrap}
.tool:hover{border-color:var(--teal-500);color:var(--ink)}
.tool.is-on{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.tool.accent{background:linear-gradient(180deg,var(--teal-300),#7fc2cb);border-color:transparent;color:#06141f;box-shadow:0 8px 18px -8px rgba(99,173,182,.8)}
.tool input[type=date]{border:0;background:none;width:118px;font-size:12.5px;font-weight:600;color:var(--ink);outline:0}
.tool input[type=range]{width:96px;accent-color:var(--teal-600)}
.tool .sp{width:1px;height:18px;background:var(--line)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.scroll{flex:1;overflow:auto;padding:8px 26px 120px;scroll-behavior:smooth}
.day{margin-top:24px}
.day-head{position:sticky;top:-8px;z-index:3;display:flex;align-items:center;gap:12px;padding:10px 4px;background:linear-gradient(var(--bg) 70%,transparent)}
.day-head h4{font-size:15px;font-weight:800}
.day-head small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.day-head .pick{margin-left:auto;font-size:12px;font-weight:700;color:var(--teal-600);padding:5px 10px;border-radius:9px}
.day-head .pick:hover{background:rgba(99,173,182,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:12px}
.tile{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#dbe6ec,#e8f0f3);box-shadow:var(--shadow);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;text-align:left;isolation:isolate}
.tile:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(11,27,48,.08),0 18px 34px -14px rgba(11,27,48,.35)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s,opacity .3s;opacity:0}
.tile img.ok{opacity:1}
.tile:hover img{transform:scale(1.045)}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,31,.28) 0,transparent 30%,transparent 55%,rgba(8,18,31,.7) 100%);opacity:.9;transition:opacity .2s;pointer-events:none;z-index:1}
.tile .meta{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;color:#fff}
.tile .meta b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.tile .meta small{display:block;font-size:11px;opacity:.85;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cat{position:absolute;left:10px;top:10px;z-index:2;max-width:calc(100% - 60px);padding:4px 10px;border-radius:999px;background:rgba(8,18,31,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#e9f6f8;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .play{position:absolute;left:50%;top:50%;z-index:2;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:rgba(10,24,42,.5);border:1px solid rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(10px)}
.tile .play svg{fill:currentColor;stroke:none;margin-left:2px}
.tile .chk{position:absolute;right:10px;top:10px;z-index:3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.9);background:rgba(8,18,31,.35);color:transparent;opacity:0;transform:scale(.85);transition:all .15s}
.tile:hover .chk,.selecting .tile .chk{opacity:1;transform:none}
.chk svg{width:14px;height:14px;stroke-width:3}
.tile.is-sel{box-shadow:0 0 0 3px var(--teal-500),0 14px 30px -12px rgba(99,173,182,.7)}
.tile.is-sel .chk{background:var(--teal-500);border-color:var(--teal-500);color:#fff;opacity:1;transform:none}
.tile.is-sel img{transform:scale(.94);border-radius:10px}
.tile.is-sel{background:#cfe6ea}

.state{display:grid;place-items:center;text-align:center;padding:90px 20px;color:var(--ink-2)}
.state .ico{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);color:var(--teal-600);margin:0 auto 18px}
.state .ico svg{width:34px;height:34px}
.state h3{font-size:18px;color:var(--ink);font-weight:800;margin-bottom:6px}
.state p{font-size:14px;line-height:1.6;max-width:420px}
.skeleton{background:linear-gradient(100deg,#dfe9ee 30%,#edf3f6 50%,#dfe9ee 70%);background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:var(--radius);aspect-ratio:1}
@keyframes sk{to{background-position:-200% 0}}
.more{display:grid;place-items:center;padding:30px;color:var(--ink-3);font-size:13px;font-weight:600}

.selbar{position:fixed;left:calc(var(--side) + (100vw - var(--side))/2);bottom:26px;transform:translate(-50%,24px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 20px;border-radius:20px;background:rgba(11,27,48,.92);backdrop-filter:blur(18px);color:#fff;box-shadow:0 24px 50px -16px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);transition:all .25s cubic-bezier(.2,.8,.2,1);z-index:20}
.selbar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.selbar b{font-size:14px;margin-right:12px;font-variant-numeric:tabular-nums}
.selbar button{height:40px;padding:0 16px;border-radius:13px;font-size:13px;font-weight:700;color:#d6e6f2;display:inline-flex;align-items:center;gap:8px}
.selbar button:hover{background:rgba(255,255,255,.1)}
.selbar .go{background:linear-gradient(180deg,var(--teal-300),#7fc2cb);color:#06141f}
.selbar .go:hover{filter:brightness(1.06);background:linear-gradient(180deg,var(--teal-300),#7fc2cb)}

/* ---------- Trình xem ---------- */
.viewer{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;background:#05101c;color:#e6f1f8;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.v-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(180deg,rgba(5,16,28,.95),rgba(5,16,28,.55));z-index:3}
.v-top .t{min-width:0;flex:1}.v-top .t b{display:block;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v-top .t small{font-size:12px;color:#8aa3ba;font-weight:600}
.v-count{font-size:12.5px;font-weight:700;color:#9db4c8;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.v-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#c3d6e6;transition:background .15s}
.v-btn:hover{background:rgba(255,255,255,.1);color:#fff}.v-btn.is-on{background:rgba(143,208,216,.2);color:var(--teal-300)}
.v-btn svg{width:20px;height:20px}
.v-stage{grid-column:1;grid-row:2;min-height:0;min-width:0;position:relative;overflow:hidden;display:grid;place-items:center;cursor:grab;touch-action:none;background:radial-gradient(900px 600px at 50% 40%,#0d2038,#05101c 70%)}
.v-stage.drag{cursor:grabbing}
.v-stage img,.v-stage video{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;transform-origin:center;will-change:transform;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.v-stage video{cursor:default;background:#000}
.v-nav{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:rgba(10,24,42,.55);border:1px solid rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);transition:all .15s;z-index:2}
.v-nav:hover{background:rgba(10,24,42,.85);transform:scale(1.06)}.v-nav:disabled{opacity:.25;pointer-events:none}
.v-nav.prev{left:18px}.v-nav.next{right:18px}.v-nav svg{width:22px;height:22px;stroke-width:2.2}
.v-load{position:absolute;display:grid;place-items:center;color:#8aa3ba;font-size:13px;gap:10px;pointer-events:none}
.v-zoom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:15px;background:rgba(10,24,42,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);z-index:2}
.v-zoom button{min-width:36px;height:34px;border-radius:10px;display:grid;place-items:center;color:#d6e6f2;font-size:12px;font-weight:700}
.v-zoom button:hover{background:rgba(255,255,255,.12)}
.v-info{width:340px;overflow:auto;background:linear-gradient(180deg,#0e2036,#0a1828);border-left:1px solid rgba(255,255,255,.07);padding:22px 22px 26px;grid-column:2;grid-row:2/4;z-index:2}
.v-info h5{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--teal-400);margin-bottom:6px}
.v-info h2{font-size:17px;font-weight:800;margin-bottom:16px;word-break:break-word}
.v-info dl div{padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.v-info dt{font-size:11px;font-weight:700;color:#7f98b1;margin-bottom:3px}
.v-info dd{font-size:13.5px;font-weight:600;color:#e6f1f8;line-height:1.5;word-break:break-word}
.v-info .dl{margin-top:16px;width:100%;height:44px;border-radius:13px;font-weight:800;color:#06141f;background:linear-gradient(180deg,var(--teal-300),#7fc2cb);display:flex;align-items:center;justify-content:center;gap:9px}
.v-film{grid-column:1;grid-row:3;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:10px 18px 14px;background:rgba(5,16,28,.9);z-index:3}
.v-film button{flex:0 0 64px;height:64px;border-radius:12px;overflow:hidden;opacity:.55;border:2px solid transparent;background:#12263d;transition:all .15s;position:relative}
.v-film button:hover{opacity:.9}.v-film button.is-cur{opacity:1;border-color:var(--teal-400);transform:translateY(-2px)}
.v-film img{width:100%;height:100%;object-fit:cover}

.toast-wrap{position:fixed;right:22px;bottom:22px;display:grid;gap:10px;z-index:90}
.toast{max-width:380px;padding:13px 16px;border-radius:14px;background:var(--navy-800);color:#eaf4fa;font-size:13.5px;font-weight:600;line-height:1.5;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.toast.err{background:#4a1c27;border-color:rgba(229,86,109,.5)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.job{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(5,16,28,.55);backdrop-filter:blur(6px)}
.job-card{width:min(440px,92vw);padding:26px;border-radius:24px;background:var(--card);box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
.job-card h3{font-size:18px;font-weight:800;margin-bottom:4px}.job-card p{font-size:13.5px;color:var(--ink-2);margin-bottom:18px}
.bar{height:10px;border-radius:6px;background:#e1ebf0;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--teal-500),var(--teal-300));transition:width .2s}
.job-card .row{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.job-card .cancel{margin-top:20px;width:100%;height:44px;border-radius:13px;border:1px solid var(--line);font-weight:700;color:var(--ink-2)}
.job-card .cancel:hover{background:#f3f8fa}

@media(max-width:1100px){:root{--side:230px}.top{flex-wrap:wrap}.search{order:5;max-width:none;flex-basis:100%;margin-left:0}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.selbar{left:50%}.v-info{position:absolute;right:0;top:60px;bottom:90px;width:min(340px,90vw);border-radius:18px 0 0 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<!-- Đăng nhập -->
<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">

<!-- Ứng dụng -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-head"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5Z"/></svg></span><div><b>TASCO DLK</b><small>CLOUD MÁY TÍNH</small></div></div></div>

      <h3>Thư viện</h3>

    </div>

    <header class="top">

      <div class="tool" title="Lọc theo ngày chụp"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg><input type="date" id="dFrom" aria-label="Từ ngày"><span class="sp"></span><input type="date" id="dTo" aria-label="Đến ngày"></div>
      <button class="tool" id="sortBtn" title="Đổi thứ tự"><svg viewBox="0 0 24 24"><path d="M8 4v16M8 20l-3-3M8 20l3-3M16 20V4M16 4l-3 3M16 4l3 3"/></svg><span id="sortLabel">Mới nhất</span></button>
      <label class="tool" title="Kích thước ảnh"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><input type="range" id="size" min="130" max="340" step="10" value="200" aria-label="Kích thước ảnh"></label>

  </main>
</div>

<div class="selbar" id="selbar"><b id="selCount">0 đã chọn</b><button id="selAll">Chọn tất cả</button><button id="selNone">Bỏ chọn</button><button class="go" id="selZip"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Tải ZIP</button></div>

    <span class="v-count" id="vCount"></span>
    <button class="v-btn" id="vInfoBtn" title="Thông tin (I)" aria-label="Thông tin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg></button>

</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module">
/* =========================================================
   TASCO DLK · Cloud trên máy tính (chỉ xem + tải)
   Dùng chung tài khoản Supabase và ảnh Cloudinary với app điện thoại.
   Quyền truy cập do chính Supabase (RLS) quyết định: chỉ thấy ảnh của mình.
   ========================================================= */
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL = "https://yxwmcpoklxpzlikxojez.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4d21jcG9rbHhwemxpa3hvamV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Njk0MDEsImV4cCI6MjA5NjE0NTQwMX0.dmyjtDDo_KTlUFyxQgoCGqEt5Bsq2krEEYg2BCyXeFc";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'tasco_dlk_supabase_auth' } });

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  check: '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L10 4.74a1 1 0 0 0-1.5.86Z"/></svg>',
  img: '<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg>',
  vid: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10.5 5-2.5v8l-5-2.5"/></svg>',
  all: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  folder: '<svg viewBox="0 0 24 24"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.2l2 2H18a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5Z"/></svg>',
  inbox: '<svg viewBox="0 0 24 24"><path d="M4 13.5 6.4 6.6A2 2 0 0 1 8.3 5.3h7.4a2 2 0 0 1 1.9 1.3L20 13.5V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M4 13.5h4.5a3.5 3.5 0 0 0 7 0H20"/></svg>',
  cloud: '<svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5Z"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
};

/* ---------- Trạng thái ---------- */
const S = {
  user: null, rows: [], albums: [], loading: false, loaded: 0, error: '', lastSync: 0,
  f: { album: 'all', kind: 'all', recent: false, category: '', q: '', from: '', to: '', sort: 'desc' },
  selected: new Set(), lastPick: -1, view: [], limit: 480,
  viewer: { open: false, index: 0 },
};
const albumName = id => S.albums.find(a => a.id === id)?.name || '';
const isVideo = r => /\/video\/upload\//.test(r.secure_url || '');
const cldURL = v => { try { const u = new URL(v); return u.protocol === 'https:' && u.hostname === 'res.cloudinary.com' ? u.href : ''; } catch (_) { return ''; } };
function thumbURL(r, size) {
  const u = cldURL(r.secure_url); if (!u) return '';
  if (isVideo(r)) return u.replace(/\/video\/upload\/(?!s--)/, `/video/upload/so_0,c_fill,w_${size},h_${size},q_auto/`).replace(/\.[a-z0-9]+(\?.*)?$/i, '.jpg');
  return u.replace(/\/image\/upload\/(?!s--)/, `/image/upload/c_fill,w_${size},h_${size},q_auto,f_auto/`);
}
function viewURL(r) {
  const u = cldURL(r.secure_url); if (!u) return '';
  if (isVideo(r)) return u;
  return u.replace(/\/image\/upload\/(?!s--)/, '/image/upload/c_limit,w_2600,q_auto,f_auto/');
}
const pad = n => String(n).padStart(2, '0');
const dt = r => new Date(r.captured_at || r.created_at);
const fmtTime = r => { const d = dt(r); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtFull = r => { const d = dt(r); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const dayKey = r => { const d = dt(r); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
function dayLabel(key) {
  const [y, m, d] = key.split('-').map(Number), date = new Date(y, m - 1, d), now = new Date();
  const diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - date) / 864e5);
  if (diff === 0) return 'Hôm nay'; if (diff === 1) return 'Hôm qua';
  return date.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
const fmtSize = b => { b = Number(b) || 0; if (!b) return '—'; if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB'; if (b < 1024 ** 3) return (b / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB'; return (b / 1024 ** 3).toFixed(2).replace('.', ',') + ' GB'; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
function toast(text, err = false, ms = 3800) {
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = text; $('#toasts').append(el);
  setTimeout(() => el.remove(), ms);
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- Tải dữ liệu ---------- */
const COLS = 'id,title,address,captured_at,created_at,source,cloud_name,secure_url,public_id,bytes,width,height,album_id,category';
function friendly(error) {
  const m = String(error?.message || error || ''), c = String(error?.code || '');
  if (c === '42501' || /row-level security|permission denied/i.test(m)) return 'Tài khoản này chưa được cấp quyền Cloud. Nhờ Admin cấp quyền rồi tải lại.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.';
  if (/Invalid login credentials/i.test(m)) return 'Sai email hoặc mật khẩu.';
  if (/Email not confirmed/i.test(m)) return 'Email chưa được xác nhận.';
  if (/rate limit|too many/i.test(m)) return 'Thử quá nhiều lần. Đợi một lát rồi đăng nhập lại.';
  return m || 'Có lỗi xảy ra. Thử lại.';
}
let loadToken = 0;
async function loadAll({ silent = false } = {}) {
  const token = ++loadToken; S.loading = true; S.error = ''; if (!silent) { S.rows = []; S.loaded = 0; } paintBusy(); if (!silent) render();
  try {
    const al = await sb.from('tasco_personal_photo_albums').select('id,name,created_at').eq('owner_id', S.user.id).order('name');
    if (al.error && !silent) throw al.error;
    if (token !== loadToken) return;
    if (!al.error) S.albums = al.data || [];
    const rows = []; let from = 0;
    for (;;) {
      const r = await sb.from('tasco_personal_photos').select(COLS).eq('owner_id', S.user.id).order('captured_at', { ascending: false }).range(from, from + 999);
      if (r.error) throw r.error;
      if (token !== loadToken) return;
      rows.push(...(r.data || [])); from += 1000;
      if (!silent) { S.rows = rows.slice(); S.loaded = rows.length; refresh(); }
      if ((r.data || []).length < 1000) break;
    }
    S.rows = rows; S.loaded = rows.length; S.lastSync = Date.now();
    const valid = new Set(rows.map(r => r.id)); for (const id of [...S.selected]) if (!valid.has(id)) S.selected.delete(id);
  } catch (e) {
    if (token !== loadToken) return;
    S.error = friendly(e); if (silent) toast(S.error, true);
  } finally {
    if (token === loadToken) { S.loading = false; paintBusy(); refresh(); }
  }
}
function paintBusy() { $('#refIcon')?.classList.toggle('spin', S.loading); $('#whoSync').textContent = S.loading ? 'Đang đồng bộ…' : S.lastSync ? 'Đồng bộ ' + pad(new Date(S.lastSync).getHours()) + ':' + pad(new Date(S.lastSync).getMinutes()) : 'Chưa đồng bộ'; }

/* ---------- Lọc + sắp xếp ---------- */
function scopeRows(skip) {
  const f = S.f, q = norm(f.q), from = f.from ? new Date(f.from + 'T00:00:00') : null, to = f.to ? new Date(f.to + 'T23:59:59.999') : null;
  const since = f.recent ? Date.now() - 7 * 864e5 : 0;
  return S.rows.filter(r => {
    if (skip !== 'album') { if (f.album === 'none' ? r.album_id : f.album !== 'all' && r.album_id !== f.album) return false; }
    if (skip !== 'kind') { if (f.kind === 'photo' && isVideo(r)) return false; if (f.kind === 'video' && !isVideo(r)) return false; }
    if (skip !== 'category' && f.category && (r.category || '') !== f.category) return false;
    if (f.recent && dt(r).getTime() < since) return false;
    const d = dt(r); if ((from && d < from) || (to && d > to)) return false;
    if (q && !norm([r.title, r.address, r.category, albumName(r.album_id)].join(' ')).includes(q)) return false;
    return true;
  });
}
function computeView() {
  const rows = scopeRows(); rows.sort((a, b) => (S.f.sort === 'desc' ? 1 : -1) * (dt(b) - dt(a)));
  S.view = rows;
}

/* ---------- Thanh bên ---------- */
function paintSide() {
  const all = S.rows, vids = all.filter(isVideo).length, recent = all.filter(r => dt(r).getTime() > Date.now() - 7 * 864e5).length;
  const nav = (on, icon, label, n, attrs) => `<button class="nav${on ? ' is-on' : ''}" ${attrs}>${icon}<span class="t">${esc(label)}</span><span class="n">${n}</span></button>`;
  const lib = [
    nav(S.f.album === 'all' && S.f.kind === 'all' && !S.f.recent, ICON.all, 'Tất cả', all.length, 'data-lib="all"'),
    nav(S.f.recent, ICON.clock, '7 ngày qua', recent, 'data-lib="recent"'),
    nav(S.f.kind === 'photo' && !S.f.recent, ICON.img, 'Ảnh', all.length - vids, 'data-lib="photo"'),
    nav(S.f.kind === 'video' && !S.f.recent, ICON.vid, 'Video', vids, 'data-lib="video"'),
  ].join('');
  $('#navLib').innerHTML = lib;
  const counts = new Map(); let none = 0; for (const r of all) { if (r.album_id) counts.set(r.album_id, (counts.get(r.album_id) || 0) + 1); else none++; }
  const albums = S.albums.map(a => nav(S.f.album === a.id, ICON.folder, a.name, counts.get(a.id) || 0, `data-album="${esc(a.id)}"`)).join('');
  $('#navAlbums').innerHTML = (albums || '') + nav(S.f.album === 'none', ICON.inbox, 'Chưa vào album', none, 'data-album="none"') || '';
  const cats = new Map(); for (const r of scopeRows('category')) { const c = r.category || ''; if (c) cats.set(c, (cats.get(c) || 0) + 1); }
  const list = [...cats].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'vi'));
  $('#navCats').innerHTML = list.length ? list.map(([c, n]) => `<button class="chip${S.f.category === c ? ' is-on' : ''}" data-cat="${esc(c)}">${esc(c)}<i>${n}</i></button>`).join('') : '<span style="font-size:12px;color:#6f8aa5;padding:0 4px">Chưa có hạng mục</span>';
  const bytes = all.reduce((s, r) => s + (Number(r.bytes) || 0), 0);
  $('#stats').innerHTML = `<div class="stat"><b>${all.length - vids}</b><span>Ảnh</span></div><div class="stat"><b>${vids}</b><span>Video</span></div><div class="stat"><b>${fmtSize(bytes).replace(' ', '')}</b><span>Dung lượng</span></div>`;
}
function paintHeader() {
  const f = S.f; let name = 'Tất cả ảnh';
  if (f.album === 'none') name = 'Chưa vào album'; else if (f.album !== 'all') name = albumName(f.album) || 'Album';
  else if (f.recent) name = '7 ngày qua'; else if (f.kind === 'photo') name = 'Ảnh'; else if (f.kind === 'video') name = 'Video';
  if (f.category) name += ' · ' + f.category;
  $('#hTitle').textContent = name;
  const v = S.view, vids = v.filter(isVideo).length;
  $('#hSub').textContent = S.loading && !S.rows.length ? 'Đang tải…' : `${v.length - vids} ảnh${vids ? ' · ' + vids + ' video' : ''}${S.loading ? ' · đang tải thêm (' + S.loaded + ')…' : ''}`;
  $('#sortLabel').textContent = f.sort === 'desc' ? 'Mới nhất' : 'Cũ nhất';
  $('#zipAll').querySelector('span').textContent = S.selected.size ? `Tải ZIP (${S.selected.size})` : 'Tải ZIP';
  $('#zipAll').disabled = !v.length;
}

/* ---------- Lưới ảnh ---------- */
function tileHTML(r, i) {
  const sel = S.selected.has(r.id), size = Number($('#size').value) > 230 ? 640 : 480, src = thumbURL(r, size);
  const sub = [fmtTime(r), r.address].filter(Boolean).join(' · ');
  return `<button class="tile${sel ? ' is-sel' : ''}" data-id="${esc(r.id)}" data-i="${i}" aria-label="${esc((r.title || 'Ảnh') + ', ' + fmtFull(r))}">${src ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async">` : ''}${r.category ? `<span class="cat">${esc(r.category)}</span>` : ''}${isVideo(r) ? `<span class="play">${ICON.play}</span>` : ''}<span class="chk" data-chk>${ICON.check}</span><span class="meta"><b>${esc(r.title || 'Ảnh của tôi')}</b><small>${esc(sub)}</small></span></button>`;
}
function render() {
  computeView(); paintSide(); paintHeader();
  const box = $('#content'); $('#app').classList.toggle('selecting', S.selected.size > 0);
  if (S.error && !S.rows.length) { box.innerHTML = `<div class="state"><div><div class="ico">${ICON.lock}</div><h3>Chưa tải được thư viện</h3><p>${esc(S.error)}</p><button class="tool accent" id="retry" style="margin:18px auto 0">Thử lại</button></div></div>`; return; }

/* ---------- Tải xuống ---------- */

}

let job = null;

$('#zipAll').addEventListener('click', () => {

/* ---------- Trình xem ---------- */
const V = { s: 1, x: 0, y: 0, rot: 0, drag: null, token: 0, info: true };

const stage = $('#vStage');

  $('#vInfo').hidden = !V.info; $('#vInfoBtn').classList.toggle('is-on', V.info); $('#viewer').style.gridTemplateColumns = V.info && innerWidth > 820 ? '1fr 340px' : '1fr';

}

  const around = []; const i = S.viewer.index; const from = Math.max(0, i - 40), to = Math.min(S.view.length, i + 41);
  for (let k = from; k < to; k++) around.push(`<button data-fi="${k}" class="${k === i ? 'is-cur' : ''}" aria-label="Mục ${k + 1}"><img src="${esc(thumbURL(S.view[k], 160))}" alt="" loading="lazy"></button>`);
  $('#vFilm').innerHTML = around.join(''); $('#vFilm').querySelector('.is-cur')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function showItem(i) {
  if (i < 0 || i >= S.view.length) return; S.viewer.index = i; const r = S.view[i], token = ++V.token; stopMedia(); V.rot = 0; V.s = 1; V.x = 0; V.y = 0;
  $('#vTitle').textContent = r.title || 'Ảnh của tôi'; $('#vDate').textContent = fmtFull(r) + (r.address ? ' · ' + r.address : ''); $('#vCount').textContent = (i + 1) + ' / ' + S.view.length;
  $('#vPrev').disabled = i === 0; $('#vNext').disabled = i === S.view.length - 1;
  const vid = isVideo(r); $('#vZoom').hidden = vid; $('#vRotate').hidden = vid; stage.style.cursor = vid ? 'default' : '';
  $('#vLoad').hidden = false; $('#vLoad').textContent = vid ? 'Đang tải video…' : 'Đang tải ảnh…';

  else { el.alt = r.title || ''; el.onload = () => { if (token === V.token) { $('#vLoad').hidden = true; paintInfo(r, el); } }; el.onerror = () => { if (token === V.token) $('#vLoad').textContent = 'Chưa tải được ảnh.'; }; }
  el.src = viewURL(r); stage.prepend(el); paintInfo(r, el);

  for (const b of $('#vFilm').querySelectorAll('button')) b.classList.toggle('is-cur', Number(b.dataset.fi) === i);
  $('#vFilm').querySelector('.is-cur')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  if (Math.abs(i - Number($('#vFilm').querySelector('button:last-child')?.dataset.fi ?? i)) < 6 || Math.abs(i - Number($('#vFilm').querySelector('button')?.dataset.fi ?? i)) < 6) paintFilm();

  const pairs = [['Hạng mục', r.category || 'Chưa phân hạng mục'], ['Album', albumName(r.album_id) || 'Chưa vào album'], ['Thời gian chụp', fmtFull(r)], ['Địa điểm', r.address || 'Chưa có địa điểm'], ['Kích thước', w && h ? `${Number(w).toLocaleString('vi-VN')} × ${Number(h).toLocaleString('vi-VN')} px` : ''], ['Dung lượng', r.bytes ? fmtSize(r.bytes) : ''], ['Định dạng', extOf(r).toUpperCase()], ['Nguồn', r.source === 'mobile_camera' ? 'Chụp từ app điện thoại' : r.source || '']];

$('#vInfoBtn').onclick = toggleInfo;
function toggleInfo() { V.info = !V.info; try { localStorage.setItem('tasco_cloud_desktop_info', V.info ? '1' : '0'); } catch (_) {} $('#vInfo').hidden = !V.info; $('#vInfoBtn').classList.toggle('is-on', V.info); $('#viewer').style.gridTemplateColumns = V.info && innerWidth > 820 ? '1fr 340px' : '1fr'; }

  const tag = (e.target.tagName || '').toLowerCase(), typing = ['input', 'textarea', 'select'].includes(tag);

/* ---------- Đăng nhập / phiên ---------- */
function showLogin(msg) { $('#app').hidden = true; $('#login').hidden = false; const er = $('#loginError'); er.hidden = !msg; er.textContent = msg || ''; $('#email').focus(); }
async function enter(user) {
  S.user = user; $('#login').hidden = true; $('#app').hidden = false;
  $('#whoEmail').textContent = user.email || '—'; $('#avatar').textContent = (user.email || '?').slice(0, 2).toUpperCase();
  try { const v = localStorage.getItem('tasco_cloud_desktop_size'); if (v) { $('#size').value = v; document.documentElement.style.setProperty('--tile', v + 'px'); } } catch (_) {}

}

  e.preventDefault(); const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Đang đăng nhập…'; $('#loginError').hidden = true;

  catch (err) { showLogin(friendly(err)); }
  finally { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
});
$('#logout').addEventListener('click', async () => { loadToken++; try { await sb.auth.signOut(); } catch (_) {} S.rows = []; S.albums = []; S.selected.clear(); S.user = null; closeViewerSafe(); showLogin(); });
function closeViewerSafe() { if (S.viewer.open) closeViewer(); }
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.user) { S.user = null; showLogin('Phiên đăng nhập đã hết. Đăng nhập lại.'); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && !S.loading && Date.now() - S.lastSync > 3 * 60 * 1000) loadAll({ silent: true }); });
addEventListener('resize', () => { if (S.viewer.open) $('#viewer').style.gridTemplateColumns = V.info && innerWidth > 820 ? '1fr 340px' : '1fr'; });
(async () => {
  try { const { data } = await sb.auth.getSession(); if (data?.session?.user) { const u = await sb.auth.getUser(); if (!u.error && u.data?.user) return enter(u.data.user); } } catch (_) {}
  showLogin();
})();
